name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Xcode ${{ matrix.xcode-version }})
    runs-on: ${{ matrix.macos-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - macos-version: macos-26
            xcode-version: "26.0"
          - macos-version: macos-26
            xcode-version: latest-stable

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  platform:
    name: Build (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform:
          - iOS Simulator
          - tvOS Simulator
          - watchOS Simulator
          - visionOS Simulator

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build CodableDefault for ${{ matrix.platform }}
        run: |
          xcodebuild build \
            -scheme CodableDefault-Package \
            -destination 'generic/platform=${{ matrix.platform }}' \
            -skipMacroValidation

  demo:
    name: Build Demo App
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build CodableDefaultDemo
        run: |
          cd Examples/CodableDefaultDemo
          xcodebuild build \
            -project CodableDefaultDemo.xcodeproj \
            -scheme CodableDefaultDemo \
            -destination 'generic/platform=iOS Simulator'
